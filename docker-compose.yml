services:
  just-chat:
    build: .
    image: just-chat
    container_name: just-chat
    ports:
      - "8081:8081"
    environment:
      # 9Router tetap jalan di host; dari container diakses lewat host.docker.internal
      AI_UPSTREAM: http://host.docker.internal:20128
      # key hanya hidup di proses server, tidak pernah ikut ke browser
      AI_API_KEY: ${AI_API_KEY}
      PORT: "8081"
    extra_hosts:
      # membuat host.docker.internal tetap resolve di Linux
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
